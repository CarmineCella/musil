# Builds Musil on macOS, Linux and Windows, runs the test suite on each (every library, the golden
# references, the memory and embedding tests, every example), and keeps the packages as artifacts.
# Pushing a tag v<version> also publishes them as a GitHub release.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j4
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Package
        run: ./deploy_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip

  linux:
    runs-on: ubuntu-22.04          # an older glibc runs on more distributions
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake xvfb libasound2-dev libx11-dev libxext-dev \
            libxft-dev libxinerama-dev libxcursor-dev libxrender-dev libxfixes-dev libfontconfig1-dev
      - name: Build
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build -j4
      - name: Test
        run: xvfb-run -a ctest --test-dir build --output-on-failure
      - name: Package
        run: ./deploy_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.vsix

  windows:                         # built on Windows itself (MSYS2, MinGW-w64): static executables
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: zip mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja mingw-w64-x86_64-python
      - name: Build
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMUSIL_READLINE=OFF && cmake --build build
      - name: Test
        run: |
          mkdir -p /c/tmp            # the examples write their sounds to /tmp
          ctest --test-dir build --output-on-failure
      - name: Package
        run: ./deploy_windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "Musil ${GITHUB_REF_NAME#v}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
